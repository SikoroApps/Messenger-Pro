name: Credentials probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credentials-probe
  cancel-in-progress: true

jobs:
  probe:
    name: Verify organization secret accessibility and shape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ESMS_API_KEY: ${{ secrets.ESMS_API_KEY }}
      # Optional deployment credentials. Their absence is reported without failure; a partial
      # configuration is a hard failure so a deployment workflow cannot silently misconfigure.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Probe secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "Credential probe failed: $1" >&2
            exit 1
          }

          require_value() {
            local name="$1"
            local value="${!name:-}"
            [[ -n "$value" ]] || fail "$name is not available to this workflow"
          }

          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            SUPABASE_PUBLISHABLE_KEY \
            SUPABASE_URL \
            SUPABASE_SERVICE_ROLE_KEY \
            ESMS_API_KEY
          do
            require_value "$name"
          done
          echo "All expected organization secrets are present in the workflow environment."

          # Keystore material is decoded only into a short-lived file outside the workspace.
          keystore="$(mktemp "${TMPDIR:-/tmp}/mp-keystore.XXXXXX")"
          chmod 600 "$keystore"
          trap 'shred -u "$keystore" 2>/dev/null || rm -f "$keystore"' EXIT
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$keystore" 2>/dev/null; then
            fail "ANDROID_KEYSTORE_BASE64 is not valid base64"
          fi
          [[ -s "$keystore" ]] || fail "decoded keystore is empty"
          if ! keytool -list -v \
            -alias "$ANDROID_KEY_ALIAS" \
            -keystore "$keystore" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD > /dev/null; then
            fail "keystore password or key alias did not verify"
          fi
          [[ ${#ANDROID_KEYSTORE_PASSWORD} -ge 6 ]] || fail "keystore password is too short"
          [[ ${#ANDROID_KEY_PASSWORD} -ge 6 ]] || fail "key password is too short"
          echo "Android signing material decoded and the configured alias verified."

          case "$SUPABASE_URL" in
            https://*.supabase.co|https://*.supabase.co/*) ;;
            *) fail "SUPABASE_URL is not an HTTPS Supabase project URL" ;;
          esac
          supabase_url="${SUPABASE_URL%/}"
          # A deliberately absent relation distinguishes an accepted key (PostgREST 404) from
          # a rejected key (gateway 401). No project data is read and no key is echoed.
          probe_path="/rest/v1/mp_probe_nonexistent_9f8c?select=id&limit=0"
          for role_name in SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY; do
            role_value="${!role_name}"
            status="$(curl --silent --show-error --location --max-time 20 \
              --output /dev/null --write-out '%{http_code}' \
              --header "apikey: $role_value" \
              "$supabase_url$probe_path")" || fail "$role_name REST probe failed"
            control_status="$(curl --silent --show-error --location --max-time 20 \
              --output /dev/null --write-out '%{http_code}' \
              --header 'apikey: sb_publishable_invalid_control_key' \
              "$supabase_url$probe_path")" || fail "Supabase negative control probe failed"
            echo "$role_name REST status: $status; invalid-key control status: $control_status"
            if [[ "$status" != "404" || "$control_status" != "401" ]]; then
              fail "$role_name was not distinguished from an invalid Supabase key"
            fi
          done
          echo "Supabase REST endpoint responded successfully to both configured keys."

          case "$ESMS_API_KEY" in
            esms_test_*) ;;
            *) fail "ESMS_API_KEY is not an eSMS sandbox test key" ;;
          esac

          esms_dir="$(mktemp -d "${TMPDIR:-/tmp}/mp-esms.XXXXXX")"
          chmod 700 "$esms_dir"
          trap 'shred -u "$keystore" 2>/dev/null || rm -f "$keystore"; rm -rf "$esms_dir"' EXIT
          idempotency_key="$(cat /proc/sys/kernel/random/uuid)"
          start_code="$(curl --silent --show-error --location --max-time 30 \
            --output "$esms_dir/start.json" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $ESMS_API_KEY" \
            --header "Content-Type: application/json" \
            --header "Idempotency-Key: $idempotency_key" \
            --data '{"to":"+26876123456","code_length":6,"expiry_seconds":300}' \
            'https://sms.esmsafrica.io/v1/verify/start')" || fail "eSMS sandbox start request failed"
          [[ "$start_code" == "200" || "$start_code" == "201" ]] || \
            fail "eSMS sandbox start returned an unexpected HTTP status"
          verification_id="$(jq -er '.verification_id | select(type == "string" and length > 0)' "$esms_dir/start.json")" || \
            fail "eSMS sandbox start response did not contain a verification id"
          sandbox_code="$(jq -r '.sandbox_code // empty' "$esms_dir/start.json")"
          [[ "$sandbox_code" == "" || "$sandbox_code" =~ ^[0-9]{6}$ ]] || \
            fail "eSMS sandbox start returned an unexpected sandbox code shape"

          # The documented fixed test code proves test-mode check access. It is not a real
          # delivery and never appears in output or artifacts.
          check_code="$(curl --silent --show-error --location --max-time 30 \
            --output "$esms_dir/check.json" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $ESMS_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$(jq -nc --arg verification_id "$verification_id" \
              '{verification_id: $verification_id, code: "000000"}')" \
            'https://sms.esmsafrica.io/v1/verify/check')" || fail "eSMS sandbox check request failed"
          [[ "$check_code" == "200" ]] || fail "eSMS sandbox check returned an unexpected HTTP status"
          check_status="$(jq -r '.status // empty' "$esms_dir/check.json")"
          [[ "$check_status" == "approved" ]] || \
            fail "eSMS sandbox check did not report the expected test status"

          rm -rf "$esms_dir"
          echo "eSMS sandbox start/check succeeded with a test key; no real SMS delivery was attempted."

          # Deployment credentials are optional. Report only presence and the management API
          # status code; never print the token, project ref, database password or response body.
          token_present=no
          ref_present=no
          db_present=no
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] && token_present=yes
          [[ -n "${SUPABASE_PROJECT_REF:-}" ]] && ref_present=yes
          [[ -n "${SUPABASE_DB_PASSWORD:-}" ]] && db_present=yes

          if [[ "$token_present" == yes && "$ref_present" == yes ]]; then
            [[ "$db_present" == yes ]] || fail "SUPABASE_DB_PASSWORD is required with deployment credentials"
            deployment_status="$(curl --silent --show-error --location --max-time 30 \
              --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF")" || \
              fail "Supabase management API probe failed"
            [[ "$deployment_status" == "200" ]] || \
              fail "Supabase management API rejected the deployment credentials (HTTP $deployment_status)"
            echo "Supabase management API accepted the optional deployment credentials."
          elif [[ "$token_present" == no && "$ref_present" == no && "$db_present" == no ]]; then
            echo "Optional Supabase deployment credentials are not available to this workflow."
          else
            echo "Deployment credential configuration is incomplete; configure all of SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD or none." >&2
            exit 1
          fi

          echo "Credential probe passed. Values and provider payloads were not printed."
